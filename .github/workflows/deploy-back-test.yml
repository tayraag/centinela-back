name: deploy-back-test

# El servidor de PRUEBAS debe reflejar SIEMPRE y SOLO main.
# Por eso no hay workflow_dispatch: el unico disparador posible es un push a main.
on:
  push:
    branches: [main]

jobs:
  deploy-test:
    name: Build & deploy to PRUEBAS (CT 102)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - el deploy solo puede ser main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Este workflow solo despliega refs/heads/main. Ref recibido: ${GITHUB_REF}"
            exit 1
          fi
          echo "OK: desplegando ${GITHUB_REF} (${GITHUB_SHA})"

      - name: Build API
        env:
          GOPATH: /opt/go/gopath
          GOMODCACHE: /opt/go/gopath/pkg/mod
          GOCACHE: /opt/go/gopath/.cache/go-build
        run: |
          # Stamp de build para GET /api/version (verificacion de integridad de infra).
          # OJO: el valor va entre comillas simples porque la hora trae un espacio.
          BUILD_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M' 2>/dev/null || date -u '+%d/%m/%Y %H:%M UTC')"
          echo "build: commit=$BUILD_COMMIT time=$BUILD_TIME"
          /opt/go/bin/go build -trimpath \
            -ldflags "-X main.buildCommit=$BUILD_COMMIT -X 'main.buildTime=$BUILD_TIME'" \
            -o /tmp/centinela-api ./cmd/api
          test -x /tmp/centinela-api

      - name: Deploy to CT 102 (PRUEBAS)
        run: |
          set -e
          sudo pct push 102 /tmp/centinela-api /tmp/centinela-api.new
          sudo pct exec 102 -- mv -f /tmp/centinela-api.new /opt/centinela-api/centinela-api
          sudo pct exec 102 -- chmod 755 /opt/centinela-api/centinela-api
          sudo pct exec 102 -- systemctl restart centinela-api
          for i in $(seq 1 30); do
            STATE=$(sudo pct exec 102 -- systemctl is-active centinela-api 2>/dev/null || true)
            echo "estado: $STATE (intento $i)"
            [ "$STATE" = "active" ] && break
            sleep 1
          done
          [ "$STATE" = "active" ] || { sudo pct exec 102 -- systemctl status --no-pager --lines=20 centinela-api || true; exit 1; }
          sudo pct exec 102 -- systemctl --no-pager --lines=5 status centinela-api