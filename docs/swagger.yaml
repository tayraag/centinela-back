basePath: /api
definitions:
  http.AccionAceptadaResponse:
    properties:
      tareaId:
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        type: string
      upid:
        example: 'UPID:pve:0008380E:0131F1BF:6A84EA54:vzstart:110:root@pam:ctid=110:starttime=6934A2E3:'
        type: string
    required:
    - upid
    type: object
  http.ActiveTaskResponse:
    properties:
      action:
        enum:
        - START
        - STOP
        - SHUTDOWN
        - REBOOT
        - DELETE
        example: START
        type: string
      status:
        enum:
        - RUNNING
        example: RUNNING
        type: string
      tareaId:
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        type: string
    required:
    - action
    - status
    - tareaId
    type: object
  http.ErrorResponse:
    properties:
      errorCode:
        example: INVALID_REQUEST
        type: string
      message:
        example: Mensaje descriptivo del error.
        type: string
    type: object
  http.EstadoNodeResponse:
    properties:
      cpu:
        $ref: '#/definitions/http.MetricaCPUNode'
      fetchedAt:
        example: "2026-10-03T14:30:05Z"
        format: date-time
        type: string
      instancesSummary:
        $ref: '#/definitions/http.ResumenInstanciasNode'
      ram:
        $ref: '#/definitions/http.MetricaCapacidadNode'
      stale:
        example: false
        type: boolean
      storage:
        $ref: '#/definitions/http.MetricaCapacidadNode'
      uptimeSeconds:
        example: 86400
        minimum: 0
        type: integer
    required:
    - cpu
    - fetchedAt
    - instancesSummary
    - ram
    - stale
    - storage
    - uptimeSeconds
    type: object
  http.InstanciaInventarioResponse:
    properties:
      activeTask:
        allOf:
        - $ref: '#/definitions/http.ActiveTaskResponse'
        x-nullable: true
      cpuUsage:
        example: 0.24
        maximum: 1
        minimum: 0
        type: number
      id:
        example: 110
        type: integer
      ip:
        example: 192.0.2.10
        type: string
        x-nullable: true
      maxRam:
        example: 4294967296
        minimum: 0
        type: integer
      name:
        example: api-produccion
        type: string
      nivelAcceso:
        enum:
        - FULL_ACCESS
        - READ_ONLY
        example: FULL_ACCESS
        type: string
      node:
        example: pve-01
        type: string
      ramUsage:
        example: 2147483648
        minimum: 0
        type: integer
      status:
        example: running
        type: string
      type:
        enum:
        - vm
        - lxc
        example: vm
        type: string
    required:
    - activeTask
    - cpuUsage
    - id
    - ip
    - maxRam
    - name
    - nivelAcceso
    - node
    - ramUsage
    - status
    - type
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  http.MetricaCPUNode:
    properties:
      cores:
        example: 16
        minimum: 1
        type: integer
      usagePercent:
        example: 37.5
        maximum: 100
        minimum: 0
        type: number
    required:
    - cores
    - usagePercent
    type: object
  http.MetricaCapacidadNode:
    properties:
      totalGb:
        example: 128
        minimum: 0
        type: number
      usagePercent:
        example: 33.01
        maximum: 100
        minimum: 0
        type: number
      usedGb:
        example: 42.25
        minimum: 0
        type: number
    required:
    - totalGb
    - usagePercent
    - usedGb
    type: object
  http.ResumenEstadoInstancias:
    properties:
      paused:
        example: 1
        minimum: 0
        type: integer
      running:
        example: 6
        minimum: 0
        type: integer
      stopped:
        example: 2
        minimum: 0
        type: integer
      total:
        example: 9
        minimum: 0
        type: integer
    required:
    - paused
    - running
    - stopped
    - total
    type: object
  http.ResumenInstanciasNode:
    properties:
      lxc:
        $ref: '#/definitions/http.ResumenEstadoInstancias'
      vms:
        $ref: '#/definitions/http.ResumenEstadoInstancias'
    required:
    - lxc
    - vms
    type: object
  http.SSECierrePayload:
    properties:
      motivo:
        enum:
        - LOGOUT
        - SESSIONS_REVOKED
        - USER_INACTIVE
        example: LOGOUT
        type: string
    required:
    - motivo
    type: object
  http.SSEDetallesEvento:
    properties:
      accion:
        enum:
        - START
        - STOP
        - SHUTDOWN
        - REBOOT
        - DELETE
        example: START
        type: string
      error:
        example: CT 201 not running
        type: string
        x-nullable: true
      estado:
        enum:
        - RUNNING
        - COMPLETED
        - FAILED
        example: COMPLETED
        type: string
      exitstatus:
        example: OK
        type: string
        x-nullable: true
      motivo:
        enum:
        - PROXMOX_ERROR
        - TIMEOUT
        type: string
        x-nullable: true
      tareaId:
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        type: string
    type: object
  http.SSEEventPayload:
    properties:
      detalles:
        $ref: '#/definitions/http.SSEDetallesEvento'
      fechaHora:
        example: "2026-09-30T11:24:03-03:00"
        format: date-time
        type: string
      id:
        example: 75d0322d-1d76-4dbf-ad0d-2571c458aa63
        type: string
      mensaje:
        example: La tarea de encendido finalizó correctamente
        type: string
      recursoId:
        example: "110"
        type: string
      recursoTipo:
        enum:
        - VM
        - LXC
        - NODE
        example: VM
        type: string
      severidad:
        enum:
        - INFO
        - WARNING
        - CRITICAL
        example: INFO
        type: string
      tipo:
        enum:
        - INSTANCE_STATE_CHANGED
        - INSTANCE_CREATED
        - RESOURCE_SATURATION
        - TASK_FINISHED
        example: TASK_FINISHED
        type: string
    required:
    - fechaHora
    - id
    - mensaje
    - recursoId
    - recursoTipo
    - severidad
    - tipo
    type: object
  http.SSETicketResponse:
    properties:
      ticket:
        example: 3cb3438a-7dec-4116-b54a-369501674c92
        type: string
    required:
    - ticket
    type: object
  http.SSETiposPayload:
    properties:
      cierre:
        $ref: '#/definitions/http.SSECierrePayload'
      taskFailed:
        $ref: '#/definitions/http.TaskFailed'
      taskSuccess:
        $ref: '#/definitions/http.TaskSuccess'
    required:
    - cierre
    - taskFailed
    - taskSuccess
    type: object
  http.TaskFailed:
    properties:
      accion:
        enum:
        - START
        - STOP
        - SHUTDOWN
        - REBOOT
        - DELETE
        example: STOP
        type: string
      error:
        example: CT 201 not running
        type: string
        x-nullable: true
      estado:
        enum:
        - FAILED
        example: FAILED
        type: string
      exitstatus:
        example: CT 201 not running
        type: string
        x-nullable: true
      motivo:
        enum:
        - PROXMOX_ERROR
        - TIMEOUT
        example: PROXMOX_ERROR
        type: string
      tareaId:
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        type: string
    required:
    - accion
    - error
    - estado
    - exitstatus
    - motivo
    - tareaId
    type: object
  http.TaskSuccess:
    properties:
      accion:
        enum:
        - START
        - STOP
        - SHUTDOWN
        - REBOOT
        - DELETE
        example: START
        type: string
      error:
        type: string
        x-nullable: true
      estado:
        enum:
        - COMPLETED
        example: COMPLETED
        type: string
      exitstatus:
        enum:
        - OK
        example: OK
        type: string
      motivo:
        type: string
        x-nullable: true
      tareaId:
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        type: string
    required:
    - accion
    - error
    - estado
    - exitstatus
    - motivo
    - tareaId
    type: object
  http.asignarPermisosRequest:
    properties:
      permisos:
        items:
          $ref: '#/definitions/ports.PermisoInstanciaInput'
        type: array
    required:
    - permisos
    type: object
  http.confirmarRecuperacionRequest:
    properties:
      codigo:
        type: string
      email:
        type: string
      nuevaContrasena:
        maxLength: 12
        minLength: 8
        type: string
    required:
    - codigo
    - email
    - nuevaContrasena
    type: object
  http.permisosResponse:
    properties:
      permisos:
        items:
          $ref: '#/definitions/ports.PermisoInstanciaInput'
        type: array
    type: object
  http.solicitarRecuperacionRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  http.verificarTotpRequest:
    properties:
      codigo:
        type: string
    required:
    - codigo
    type: object
  ports.ActividadDTO:
    properties:
      accion:
        type: string
      detalles:
        type: string
      fechaHora:
        type: string
      id:
        type: string
      instanciaId:
        type: string
      instanciaNombre:
        type: string
      resultado:
        type: string
    type: object
  ports.ActualizarPerfilInput:
    properties:
      emailUsuario:
        type: string
      nombreCompleto:
        maxLength: 255
        minLength: 2
        type: string
    type: object
  ports.ActualizarUsuarioInput:
    properties:
      activo:
        description: puntero para distinguir false de "no enviado"
        type: boolean
      emailUsuario:
        type: string
      nombreCompleto:
        type: string
      rol:
        enum:
        - ADMIN
        - OPERATOR
        type: string
    type: object
  ports.AuditoriaDTO:
    properties:
      accion:
        type: string
      detalles:
        type: string
      fechaHora:
        type: string
      id:
        type: string
      instanciaId:
        type: string
      instanciaNombre:
        type: string
      nombreUsuario:
        description: Nombre completo (JOIN con usuarios, o "[usuario eliminado]")
        type: string
      resultado:
        type: string
      usuarioId:
        description: 'Puntero: puede ser null si el usuario fue eliminado'
        type: string
    type: object
  ports.CambiarContrasenaInput:
    properties:
      contrasenaActual:
        type: string
      contrasenaNueva:
        maxLength: 12
        minLength: 8
        type: string
    required:
    - contrasenaActual
    - contrasenaNueva
    type: object
  ports.CrearUsuarioInput:
    properties:
      emailUsuario:
        type: string
      nombreCompleto:
        maxLength: 255
        minLength: 2
        type: string
      nombreUsuario:
        maxLength: 100
        minLength: 3
        type: string
      rol:
        enum:
        - ADMIN
        - OPERATOR
        type: string
    required:
    - emailUsuario
    - nombreCompleto
    - nombreUsuario
    - rol
    type: object
  ports.CrearUsuarioResult:
    properties:
      activo:
        type: boolean
      id:
        type: string
      rol:
        type: string
    type: object
  ports.InstanciaProxmoxDTO:
    properties:
      cpu:
        description: Telemetría en tiempo real (0 cuando la instancia está detenida)
        type: number
      estado:
        description: '"running" | "stopped" | ...'
        type: string
      maxCpu:
        description: cantidad de vCPUs asignadas
        type: integer
      maxMem:
        description: RAM máxima asignada (bytes)
        type: integer
      mem:
        description: RAM usada (bytes)
        type: integer
      nodo:
        type: string
      nombre:
        type: string
      tipo:
        description: '"qemu" | "lxc"'
        type: string
      vmid:
        type: integer
    type: object
  ports.ListaUsuariosResult:
    properties:
      summary:
        $ref: '#/definitions/ports.ResumenUsuariosDTO'
      users:
        items:
          $ref: '#/definitions/ports.UsuarioResumenDTO'
        type: array
    type: object
  ports.LoginResult:
    properties:
      cambioContrasenaRequerido:
        description: true si el usuario debe cambiar su contraseña antes de continuar
        type: boolean
      jwtTemporal:
        type: string
      totpVinculado:
        type: boolean
    type: object
  ports.PaginaAuditoria:
    properties:
      items:
        description: Registros de esta página
        items:
          $ref: '#/definitions/ports.AuditoriaDTO'
        type: array
      pagina:
        description: Página actual
        type: integer
      total:
        description: Total de registros que coinciden con los filtros
        type: integer
    type: object
  ports.PermisoInstanciaDTO:
    properties:
      nivelAcceso:
        description: '"FULL_ACCESS" | "READ_ONLY"'
        type: string
      vmid:
        type: integer
    type: object
  ports.PermisoInstanciaInput:
    properties:
      nivelAcceso:
        type: string
      vmid:
        type: integer
    type: object
  ports.QRResult:
    properties:
      qrBase64:
        type: string
      secretoManual:
        description: Solo retornado en la vinculación inicial, nunca más
        type: string
    type: object
  ports.ResumenUsuariosDTO:
    properties:
      admins:
        type: integer
      operators:
        type: integer
      total:
        type: integer
    type: object
  ports.RolDTO:
    properties:
      descripcion:
        type: string
      valor:
        type: string
    type: object
  ports.TokenResult:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: segundos hasta expiración del access token
        type: integer
    type: object
  ports.UsuarioDetalleDTO:
    properties:
      activo:
        type: boolean
      cambioContrasenaRequerido:
        type: boolean
      emailUsuario:
        type: string
      fechaCreacion:
        type: string
      fechaUltimoAcceso:
        type: string
      id:
        type: string
      instanciasPermitidas:
        description: VMIDs de Proxmox
        items:
          type: integer
        type: array
      nombreCompleto:
        type: string
      nombreUsuario:
        type: string
      organizacionId:
        type: string
      permisos:
        items:
          $ref: '#/definitions/ports.PermisoInstanciaDTO'
        type: array
      rol:
        type: string
      totpVinculado:
        type: boolean
    type: object
  ports.UsuarioResumenDTO:
    properties:
      activo:
        type: boolean
      emailUsuario:
        type: string
      esUsuarioActual:
        description: true si coincide con el usuario autenticado
        type: boolean
      fechaCreacion:
        type: string
      fechaUltimoAcceso:
        type: string
      id:
        type: string
      nombreCompleto:
        type: string
      nombreUsuario:
        type: string
      rol:
        type: string
      totpVinculado:
        type: boolean
    type: object
info:
  contact:
    name: Soporte El Centinela
  description: |-
    API REST para el sistema de monitoreo de instancias Proxmox El Centinela.
    **Flujo de autenticación**: Login → `/auth/login` → obtener `jwtTemporal` → `/auth/2fa/verify` → obtener `accessToken` → usar en el botón **Authorize** de esta UI.
  title: El Centinela API
  version: "1.0"
paths:
  /account/password:
    put:
      consumes:
      - application/json
      description: 'Valida la contraseña actual y aplica la nueva. Reglas de complejidad:
        entre 8 y 12 caracteres, al menos una mayúscula, un número y un carácter especial
        (!@#$%^&*-_=+). Si la contraseña era temporal (`cambioContrasenaRequerido=true`),
        este cambio limpia ese flag y desbloquea el acceso al resto de la plataforma.'
      parameters:
      - description: Contraseña actual y nueva
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.CambiarContrasenaInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Formato inválido, contraseña actual incorrecta, nueva igual
            a la actual o no cumple las reglas de complejidad
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PASSWORD_CHANGE_REQUIRED — solo este endpoint y logout son
            accesibles mientras el flag esté activo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cambiar mi contraseña
      tags:
      - Mi cuenta
  /account/profile:
    get:
      description: Devuelve el perfil completo del usuario autenticado, incluyendo
        sus instancias Proxmox permitidas.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioDetalleDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener mi perfil
      tags:
      - Mi cuenta
    put:
      consumes:
      - application/json
      description: Permite al usuario modificar su propio `nombreCompleto` y/o `emailUsuario`.
        No permite cambiar rol ni organización.
      parameters:
      - description: Datos a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.ActualizarPerfilInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioResumenDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email ya en uso
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar mi perfil
      tags:
      - Mi cuenta
  /admin/audit:
    get:
      description: Devuelve el log de auditoría de la organización con soporte de
        filtros, paginación y ordenamiento. Solo accesible por ADMIN.
      parameters:
      - description: Filtrar por UUID de usuario
        in: query
        name: usuarioId
        type: string
      - description: 'Filtrar por tipo de acción (ej: LOGIN, CREAR_USUARIO)'
        in: query
        name: accion
        type: string
      - description: Filtrar por ID de instancia Proxmox
        in: query
        name: instanciaId
        type: string
      - description: 'Filtrar por resultado: EXITO o FALLA'
        in: query
        name: resultado
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      - description: Número de página (default 1)
        in: query
        name: pagina
        type: integer
      - description: Registros por página (default 50, máx 200)
        in: query
        name: tamano
        type: integer
      - description: 'Campo de ordenamiento: fechaHora (default), accion, resultado'
        in: query
        name: ordenarPor
        type: string
      - description: 'Dirección: desc (default) o asc'
        in: query
        name: direccion
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.PaginaAuditoria'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar log de auditoría
      tags:
      - Auditoría (Admin)
  /admin/audit/export:
    get:
      description: Exporta el log de auditoría de la organización. Aplica los mismos
        filtros que el listado. Retorna el archivo como adjunto descargable. Solo
        accesible por ADMIN.
      parameters:
      - description: Filtrar por UUID de usuario
        in: query
        name: usuarioId
        type: string
      - description: Filtrar por tipo de acción
        in: query
        name: accion
        type: string
      - description: Filtrar por ID de instancia
        in: query
        name: instanciaId
        type: string
      - description: EXITO o FALLA
        in: query
        name: resultado
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      - description: 'Formato de exportación: csv (default) o json'
        in: query
        name: formato
        type: string
      produces:
      - text/csv
      - application/json
      responses:
        "200":
          description: Archivo CSV o JSON descargable
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Exportar log de auditoría
      tags:
      - Auditoría (Admin)
  /admin/users:
    get:
      description: 'Devuelve todos los usuarios de la organización del admin autenticado,
        con un resumen (`summary`) de totales por rol. Soporta filtros opcionales:
        `?rol=ADMIN|OPERATOR`, `?activo=true|false`, `?buscar=texto` (nombre o email).'
      parameters:
      - description: 'Filtrar por rol: ADMIN o OPERATOR'
        in: query
        name: rol
        type: string
      - description: 'Filtrar por estado: true o false'
        in: query
        name: activo
        type: boolean
      - description: Buscar por nombre o email (case-insensitive)
        in: query
        name: buscar
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.ListaUsuariosResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar usuarios de la organización
      tags:
      - Usuarios (Admin)
    post:
      consumes:
      - application/json
      description: Crea un nuevo usuario con contraseña temporal generada automáticamente.
        La contraseña se envía al usuario por email. El usuario deberá cambiarla en
        su primer login.
      parameters:
      - description: Datos del nuevo usuario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.CrearUsuarioInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ports.CrearUsuarioResult'
        "400":
          description: Datos inválidos
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email o username ya registrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}:
    delete:
      description: Marca al usuario como inactivo (`activo=false`) sin borrarlo físicamente,
        e invalida todas sus sesiones activas. Un admin no puede eliminarse a sí mismo.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "400":
          description: No puede eliminarse a sí mismo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar usuario (soft-delete)
      tags:
      - Usuarios (Admin)
    get:
      description: Devuelve el perfil detallado del usuario incluyendo sus instancias
        Proxmox permitidas (`instanciasPermitidas`). Solo devuelve usuarios de la
        misma organización del admin.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioDetalleDTO'
        "400":
          description: UUID inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener usuario por ID
      tags:
      - Usuarios (Admin)
    put:
      consumes:
      - application/json
      description: 'Actualiza parcialmente los datos de un usuario. Solo se modifican
        los campos presentes en el body (semántica PATCH). Campos posibles: `nombreCompleto`,
        `emailUsuario`, `rol`, `activo`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      - description: Campos a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.ActualizarUsuarioInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioResumenDTO'
        "400":
          description: Datos inválidos
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email ya registrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/2fa/reset:
    post:
      description: Invalida el secreto TOTP del usuario. En su próximo login deberá
        escanear un nuevo QR para vincular 2FA. También invalida todas sus sesiones
        activas.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resetear 2FA del usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/activity:
    get:
      description: 'Devuelve hasta 100 registros de auditoría del usuario, ordenados
        del más reciente al más antiguo. Soporta filtros: `?accion=START|STOP|...`,
        `?desde=2026-01-01`, `?hasta=2026-12-31`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        type: string
      - description: Filtrar por tipo de acción
        in: query
        name: accion
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ports.ActividadDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actividad auditada del usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/password/reset:
    post:
      description: Genera una nueva contraseña temporal segura, la hashea, la persiste
        y se la envía al usuario por email. Establece `must_change_password=true`
        e invalida todas las sesiones activas del usuario. Solo su hash queda en base
        de datos. Requiere rol ADMIN.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: OPERATOR recibe 403 Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Usuario no encontrado en la organización
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restablecer contraseña (admin)
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/permissions:
    get:
      description: Devuelve las instancias de Proxmox a las que tiene acceso el usuario,
        con su nivel (FULL_ACCESS o READ_ONLY). Si no tiene permisos asignados, devuelve
        un array vacío.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.permisosResponse'
        "400":
          description: UUID inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener permisos de instancia del usuario
      tags:
      - Usuarios (Admin)
    put:
      consumes:
      - application/json
      description: 'Reemplaza atómicamente todos los permisos de instancia del usuario,
        con su nivel de acceso. Envía `{"permisos": [{"vmid": 100, "nivelAcceso":
        "READ_ONLY"}]}`. Si se omite nivelAcceso en un ítem, se asume FULL_ACCESS.
        Para quitar todos los permisos, enviar `{"permisos": []}`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      - description: Lista de permisos (vmid + nivelAcceso) a asignar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.asignarPermisosRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Asignar instancias Proxmox al usuario
      tags:
      - Usuarios (Admin)
  /auth/2fa/qr:
    get:
      description: Genera el secreto TOTP, lo cifra y devuelve el QR en Base64 más
        el secreto manual. Solo disponible con JWT temporal (pre-auth). Llamar únicamente
        si `totpVinculado` es false. Si el usuario ya tiene 2FA activo, se rechaza
        con 409.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.QRResult'
        "400":
          description: Error interno al generar el QR
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Token pre-auth inválido o expirado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: El 2FA ya está activo, requiere reset administrativo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerPreAuth: []
      summary: Obtener QR de vinculación 2FA
      tags:
      - Autenticación 2FA
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: Recibe el código de 6 dígitos del autenticador. Si es correcto
        emite el `accessToken` (8h) y el `refreshToken` (30 días) con 2FA completado.
        Funciona tanto para la primera vinculación como para logins posteriores.
      parameters:
      - description: Código TOTP de 6 dígitos
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.verificarTotpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.TokenResult'
        "400":
          description: Código inválido (no tiene 6 dígitos)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Código TOTP incorrecto o ya utilizado (anti-replay)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerPreAuth: []
      summary: Verificar código TOTP → obtener tokens definitivos
      tags:
      - Autenticación 2FA
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida email y contraseña. Si son correctas emite un JWT temporal
        (5 min) para continuar el flujo 2FA. El campo `totpVinculado` indica si el
        usuario debe escanear el QR (false) o ingresar el código TOTP (true). El campo
        `cambioContrasenaRequerido` indica si la contraseña es temporal y debe cambiarse.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.LoginResult'
        "400":
          description: Formato de petición inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Credenciales incorrectas
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Login de usuario
      tags:
      - Autenticación
  /auth/logout:
    post:
      description: Invalida la sesión asociada al refresh token en la cookie `centinela_refresh`.
        Emite la eliminación de la cookie y responde 204.
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "401":
          description: Refresh token inválido, sesión ya cerrada o cookie ausente
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Cerrar sesión (logout)
      tags:
      - Autenticación
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Genera un código de 6 dígitos válido por 15 minutos y lo envía
        al correo del usuario. Retorna 200 OK incluso si el correo no existe para
        evitar enumeración.
      parameters:
      - description: Email del usuario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.solicitarRecuperacionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Email inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Solicitar recuperación de contraseña
      tags:
      - Autenticación
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Valida el código de 6 dígitos enviado por email y establece la
        nueva contraseña (8-12 chars, mayúscula, número, especial). Invalida el código
        tras el uso o tras 3 intentos fallidos. La nueva contraseña no puede coincidir
        con la anterior.
      parameters:
      - description: Datos de recuperación
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.confirmarRecuperacionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Datos inválidos, código incorrecto, demasiados intentos, contraseña
            débil o igual a la actual
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Confirmar recuperación de contraseña
      tags:
      - Autenticación
  /auth/refresh:
    post:
      description: Lee el refresh token desde la cookie HTTP-Only, valida la sesión
        y emite un nuevo access token. Rota la cookie emitiendo un nuevo refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.TokenResult'
        "401":
          description: Cookie no provista, o refresh token inválido/expirado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Renovar access token
      tags:
      - Autenticación
  /events:
    get:
      description: 'Abre un stream `text/event-stream` autenticado con el ticket de
        `POST /api/events/ticket`, que es de un solo uso y vence a los 30 s: si se
        conecta dos veces o después de vencer, responde 401 y hay que pedir otro.
        El ticket se consume con `GETDEL` al abrir el stream y el servidor manda `Cache-Control:
        no-cache`, `Connection: keep-alive` y `X-Accel-Buffering: no` para que un
        proxy nginx no acumule el stream. El framing tiene cuatro formas: (1) `: conectado`
        apenas se abre, que `EventSource` ignora; (2) un frame `id: <evento.id>` seguido
        de `data: <http.SSEEventPayload en JSON>` por cada evento, que `EventSource`
        entrega en `onmessage`; (3) `: ping` cada 25 s para que ningún proxy corte
        la conexión por inactividad; (4) `event: cierre` con `{"motivo": ...}` cuando
        el backend corta el stream, con motivo `LOGOUT`, `SESSIONS_REVOKED` o `USER_INACTIVE`.
        Importante: `EventSource` reconecta solo con la misma URL, y el ticket ya
        fue consumido, por lo que hay que cerrar la fuente y abrir un stream nuevo
        con un ticket nuevo.'
      parameters:
      - description: Ticket de un solo uso
        in: query
        name: ticket
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'evento del stream, envuelto en el frame data: del protocolo
            SSE'
          schema:
            $ref: '#/definitions/http.SSEEventPayload'
        "401":
          description: EVENTS_TICKET_MISSING | EVENTS_TICKET_INVALID
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: EVENTS_UNAVAILABLE
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Stream de eventos en tiempo real (SSE)
      tags:
      - Eventos en tiempo real
  /events/contrato-sse:
    get:
      description: 'Índice de los esquemas que el stream `GET /api/events` puede emitir:
        `http.TaskSuccess` (evento `TASK_FINISHED` con `estado` `COMPLETED`), `http.TaskFailed`
        (el mismo evento con `estado` `FAILED`, `motivo` PROXMOX_ERROR o TIMEOUT y
        `error`) y `http.SSECierrePayload` (el cuerpo del frame `event: cierre`).
        Este es el `detalles` de los eventos, no el sobre completo, que es `http.SSEEventPayload`.
        No es una ruta del servidor y no se puede invocar: el stream real y su framing
        se documentan en `GET /api/events`.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: índice de las formas concretas del stream
          schema:
            $ref: '#/definitions/http.SSETiposPayload'
      summary: Formas concretas del payload del stream SSE (solo documentación)
      tags:
      - Eventos en tiempo real
      x-implementation-status: documentation-only
  /events/ticket:
    post:
      description: 'Devuelve un ticket de un solo uso, válido por 30 s, para abrir
        GET /api/events?ticket=... El navegador (EventSource) no puede mandar el header
        Authorization, y así el JWT nunca viaja en la URL. Esta operación sí usa `Authorization:
        Bearer <accessToken>`; el ticket es el que se lo reemplaza en el stream.'
      produces:
      - application/json
      responses:
        "200":
          description: ticket de un solo uso, válido 30 s
          schema:
            $ref: '#/definitions/http.SSETicketResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: EVENTS_UNAVAILABLE
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pedir ticket para el stream de eventos
      tags:
      - Eventos en tiempo real
  /instances:
    get:
      description: OPERATIVO. Lee en vivo el inventario de Proxmox VE (VMs y contenedores).
        Un ADMIN recibe el cluster completo; un OPERATOR recibe únicamente las instancias
        que tiene asignadas. Incluye telemetría (CPU en porcentaje 0-100, RAM en bytes
        y MaxRam en bytes), nivel de acceso y tarea activa. Si la instancia está apagada
        (stopped), cpuUsage y ramUsage serán estrictamente null. ip puede ser null;
        activeTask es el objeto { tareaId, action, status } de la tarea RUNNING de
        la instancia, o null si no tiene ninguna.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.InstanciaInventarioResponse'
            type: array
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — error al consultar los permisos del usuario
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo; la acción
            puede haberse aplicado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar instancias
      tags:
      - Instancias Proxmox
  /instances/{vmid}:
    delete:
      description: 'OPERATIVO. Solo ADMIN. Elimina permanentemente una VM o contenedor
        de Proxmox. La instancia debe estar detenida (stopped); si no, responde 409.
        La operación es asíncrona, igual que las acciones de energía: responde 202
        Accepted con el UPID de la tarea de borrado y el tareaId; el resultado llega
        en el evento TASK_FINISHED con accion DELETE.'
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: 'Borrado aceptado: upid de la tarea en Proxmox y tareaId. tareaId
            se omite si no se pudo registrar la tarea'
          schema:
            $ref: '#/definitions/http.AccionAceptadaResponse'
        "400":
          description: INVALID_VMID — el vmid de la ruta no es un número entero
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | INVALID_ROLE | INSUFFICIENT_PERMISSIONS | INVALID_VMID | INSTANCE_PROTECTED
            — solo ADMIN puede eliminar instancias
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND — la instancia no existe en Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: INSTANCE_INVALID_STATE — la instancia debe estar detenida |
            INSTANCE_BUSY — la instancia está ejecutando otra tarea
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — error inesperado de Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado;
            la orden NO llegó a aplicarse
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo; el borrado
            puede haberse aplicado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Eliminar instancia
      tags:
      - Instancias Proxmox
    get:
      description: Devuelve el estado actual (running/stopped, tipo, nodo, telemetría)
        de una VM o contenedor leído en vivo desde Proxmox VE.
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.InstanciaProxmoxDTO'
        "400":
          description: INVALID_VMID — el vmid de la ruta no es un número entero
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | NO_USER | INVALID_USER_ID | INSTANCE_ACCESS_DENIED — el OPERATOR
            no tiene este vmid asignado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND — la instancia no existe en Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — al verificar permisos de acceso o error inesperado
            de Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener instancia
      tags:
      - Instancias Proxmox
  /instances/{vmid}/pause:
    post:
      description: PLANIFICADO; NO OPERATIVO. Contrato objetivo para pausar una VM
        o contenedor en Proxmox VE. La ruta no está registrada y actualmente responde
        404 NOT_FOUND; pause tampoco es una acción válida en POST /instances/{vmid}/status/{action}
        (responde 400 INVALID_ACTION).
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: 'Acción aceptada: upid de la tarea en Proxmox y tareaId'
          schema:
            $ref: '#/definitions/http.AccionAceptadaResponse'
        "400":
          description: INVALID_VMID
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | NO_USER | INVALID_USER_ID | INSTANCE_ACCESS_DENIED | INSTANCE_PROTECTED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: INSTANCE_BUSY
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pausar instancia (planificado)
      tags:
      - Instancias Proxmox
      x-implementation-status: planned
  /instances/{vmid}/start:
    post:
      description: 'OPERATIVO. Dispara el arranque de una VM o contenedor en Proxmox
        VE. La operación es asíncrona: responde 202 Accepted con el UPID de la tarea
        creada en Proxmox. No espera a que la instancia quede encedida.'
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: 'Acción aceptada: upid de la tarea en Proxmox y tareaId. tareaId
            se omite si no se pudo registrar la tarea'
          schema:
            $ref: '#/definitions/http.AccionAceptadaResponse'
        "400":
          description: INVALID_VMID — el vmid de la ruta no es un número entero
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | NO_USER | INVALID_USER_ID | INSTANCE_ACCESS_DENIED — el OPERATOR
            no tiene FULL_ACCESS sobre este vmid | INSTANCE_PROTECTED — infraestructura
            de El Centinela
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND — la instancia no existe en Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: INSTANCE_INVALID_STATE — la instancia no está stopped | INSTANCE_BUSY
            — la instancia está ejecutando otra tarea; reintentar al recibir TASK_FINISHED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — al verificar permisos de acceso o error inesperado
            de Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado;
            la orden NO llegó a aplicarse
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo; la acción
            puede haberse aplicado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Iniciar instancia
      tags:
      - Instancias Proxmox
  /instances/{vmid}/status/{action}:
    post:
      description: 'OPERATIVO. Ejecuta una acción de ciclo de vida (start, stop, shutdown,
        reboot) sobre una VM o contenedor. El endpoint genérico complementa a /start
        y /stop manteniendo retrocompatibilidad. La acción Pause NO está implementada:
        use POST /instances/{vmid}/pause, que hoy responde 404 NOT_FOUND.'
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      - description: 'Acción a ejecutar (start | stop | shutdown | reboot). pause
          NO es válida: responde 400 INVALID_ACTION'
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 'Acción aceptada: upid de la tarea en Proxmox y tareaId. tareaId
            se omite si no se pudo registrar la tarea'
          schema:
            $ref: '#/definitions/http.AccionAceptadaResponse'
        "400":
          description: INVALID_VMID | INVALID_ACTION — acción distinta de start, stop,
            shutdown o reboot
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | NO_USER | INVALID_USER_ID | INSTANCE_ACCESS_DENIED | INSTANCE_PROTECTED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND — la instancia no existe en Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: INSTANCE_INVALID_STATE — start exige stopped; stop, shutdown
            y reboot exigen running | INSTANCE_BUSY — la instancia está ejecutando
            otra tarea; reintentar al recibir TASK_FINISHED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — al verificar permisos de acceso o error inesperado
            de Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado;
            la orden NO llegó a aplicarse
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo; la acción
            puede haberse aplicado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cambiar estado de instancia
      tags:
      - Instancias Proxmox
  /instances/{vmid}/stop:
    post:
      description: 'OPERATIVO. Dispara el apagado forzado de una VM o contenedor en
        Proxmox VE. La operación es asíncrona: responde 202 Accepted con el UPID de
        la tarea creada en Proxmox. No espera a que la instancia quede detenida.'
      parameters:
      - description: VMID de la instancia
        in: path
        name: vmid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: 'Acción aceptada: upid de la tarea en Proxmox y tareaId. tareaId
            se omite si no se pudo registrar la tarea'
          schema:
            $ref: '#/definitions/http.AccionAceptadaResponse'
        "400":
          description: INVALID_VMID — el vmid de la ruta no es un número entero
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
            | NO_ROLE | NO_USER | INVALID_USER_ID | INSTANCE_ACCESS_DENIED | INSTANCE_PROTECTED
            — infraestructura de El Centinela
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: INSTANCE_NOT_FOUND — la instancia no existe en Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: INSTANCE_INVALID_STATE — la instancia no está running | INSTANCE_BUSY
            — la instancia está ejecutando otra tarea; reintentar al recibir TASK_FINISHED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: INTERNAL_ERROR — al verificar permisos de acceso o error inesperado
            de Proxmox
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado;
            la orden NO llegó a aplicarse
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo; la acción
            puede haberse aplicado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detener instancia
      tags:
      - Instancias Proxmox
  /node/status:
    get:
      description: 'OPERATIVO. Disponible para ADMIN y OPERATOR autenticados (no se
        filtra por permisos de instancia). La lectura se cachea en Redis 10 s (node:status:current):
        mientras está vigente se responde sin consultar Proxmox. Incluye también instancesSummary,
        que agrupa el recuento de VMs y contenedores LXC según su estado (running,
        stopped, paused). Si Proxmox no responde se devuelve la última lectura conocida
        (node:status:last_known) con `stale: true`; `fetchedAt` indica cuándo se obtuvo.
        Solo si no hay ninguna lectura previa responde 502 o 504. RAM y almacenamiento
        en GB (1024³ bytes) con 2 decimales; `storage` es el disco raíz del nodo;
        `cores` son los hilos lógicos sobre los que se calcula `usagePercent`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.EstadoNodeResponse'
        "401":
          description: MISSING_TOKEN | INVALID_TOKEN | TOKEN_REVOKED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: WRONG_TOKEN_TYPE | 2FA_REQUIRED | PASSWORD_CHANGE_REQUIRED
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: PROXMOX_UNAVAILABLE — Proxmox caído, sin red o token rechazado,
            y sin lectura previa
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "504":
          description: PROXMOX_TIMEOUT — Proxmox no respondió a tiempo y no hay lectura
            previa
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar estado consolidado del nodo
      tags:
      - Estado del nodo
  /roles:
    get:
      description: Devuelve los roles definidos en el sistema (ADMIN y OPERATOR).
        Útil para poblar selectores en el frontend al crear o editar usuarios.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ports.RolDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar roles disponibles
      tags:
      - Usuarios (Admin)
securityDefinitions:
  BearerAuth:
    description: 'Token de acceso definitivo. Formato: **Bearer &lt;accessToken&gt;**.
      Obtené el token completando el flujo: `POST /auth/login` → `POST /auth/2fa/verify`.'
    in: header
    name: Authorization
    type: apiKey
  BearerPreAuth:
    description: 'JWT temporal pre-2FA. Formato: **Bearer &lt;jwtTemporal&gt;**. Obtené
      el token de `POST /auth/login`.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
