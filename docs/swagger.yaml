basePath: /api
definitions:
  http.ErrorResponse:
    properties:
      errorCode:
        example: INVALID_REQUEST
        type: string
      message:
        example: Mensaje descriptivo del error.
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  http.LogoutRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  http.asignarPermisosRequest:
    properties:
      vmids:
        items:
          type: integer
        type: array
    required:
    - vmids
    type: object
  http.refreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  http.verificarTotpRequest:
    properties:
      codigo:
        type: string
    required:
    - codigo
    type: object
  ports.ActividadDTO:
    properties:
      accion:
        type: string
      detalles:
        type: string
      fechaHora:
        type: string
      id:
        type: string
      instanciaId:
        type: string
      instanciaNombre:
        type: string
      resultado:
        type: string
    type: object
  ports.ActualizarPerfilInput:
    properties:
      emailUsuario:
        type: string
      nombreCompleto:
        maxLength: 255
        minLength: 2
        type: string
    type: object
  ports.ActualizarUsuarioInput:
    properties:
      activo:
        description: puntero para distinguir false de "no enviado"
        type: boolean
      emailUsuario:
        type: string
      nombreCompleto:
        type: string
      rol:
        enum:
        - ADMIN
        - OPERATOR
        type: string
    type: object
  ports.AuditoriaDTO:
    properties:
      accion:
        type: string
      detalles:
        type: string
      fechaHora:
        type: string
      id:
        type: string
      instanciaId:
        type: string
      instanciaNombre:
        type: string
      nombreUsuario:
        description: Nombre completo (JOIN con usuarios, o "[usuario eliminado]")
        type: string
      resultado:
        type: string
      usuarioId:
        description: 'Puntero: puede ser null si el usuario fue eliminado'
        type: string
    type: object
  ports.CambiarContrasenaInput:
    properties:
      contrasenaActual:
        type: string
      contrasenaNueva:
        minLength: 8
        type: string
    required:
    - contrasenaActual
    - contrasenaNueva
    type: object
  ports.CrearUsuarioInput:
    properties:
      emailUsuario:
        type: string
      nombreCompleto:
        maxLength: 255
        minLength: 2
        type: string
      nombreUsuario:
        maxLength: 100
        minLength: 3
        type: string
      rol:
        enum:
        - ADMIN
        - OPERATOR
        type: string
    required:
    - emailUsuario
    - nombreCompleto
    - nombreUsuario
    - rol
    type: object
  ports.CrearUsuarioResult:
    properties:
      activo:
        type: boolean
      contrasenaTemp:
        description: Solo devuelto aquí (Plan A sin SMTP)
        type: string
      id:
        type: string
      rol:
        type: string
    type: object
  ports.ListaUsuariosResult:
    properties:
      summary:
        $ref: '#/definitions/ports.ResumenUsuariosDTO'
      users:
        items:
          $ref: '#/definitions/ports.UsuarioResumenDTO'
        type: array
    type: object
  ports.LoginResult:
    properties:
      cambioContrasenaRequerido:
        description: true si el usuario debe cambiar su contraseña antes de continuar
        type: boolean
      jwtTemporal:
        type: string
      totpVinculado:
        type: boolean
    type: object
  ports.PaginaAuditoria:
    properties:
      items:
        description: Registros de esta página
        items:
          $ref: '#/definitions/ports.AuditoriaDTO'
        type: array
      pagina:
        description: Página actual
        type: integer
      total:
        description: Total de registros que coinciden con los filtros
        type: integer
    type: object
  ports.QRResult:
    properties:
      qrBase64:
        type: string
      secretoManual:
        description: Solo retornado en la vinculación inicial, nunca más
        type: string
    type: object
  ports.ResumenUsuariosDTO:
    properties:
      admins:
        type: integer
      operators:
        type: integer
      total:
        type: integer
    type: object
  ports.RolDTO:
    properties:
      descripcion:
        type: string
      valor:
        type: string
    type: object
  ports.TokenResult:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: segundos hasta expiración del access token
        type: integer
      refreshToken:
        type: string
    type: object
  ports.UsuarioDetalleDTO:
    properties:
      activo:
        type: boolean
      cambioContrasenaRequerido:
        type: boolean
      emailUsuario:
        type: string
      fechaCreacion:
        type: string
      fechaUltimoAcceso:
        type: string
      id:
        type: string
      instanciasPermitidas:
        description: VMIDs de Proxmox
        items:
          type: integer
        type: array
      nombreCompleto:
        type: string
      nombreUsuario:
        type: string
      organizacionId:
        type: string
      rol:
        type: string
      totpVinculado:
        type: boolean
    type: object
  ports.UsuarioResumenDTO:
    properties:
      activo:
        type: boolean
      emailUsuario:
        type: string
      esUsuarioActual:
        description: true si coincide con el usuario autenticado
        type: boolean
      fechaCreacion:
        type: string
      fechaUltimoAcceso:
        type: string
      id:
        type: string
      nombreCompleto:
        type: string
      nombreUsuario:
        type: string
      rol:
        type: string
      totpVinculado:
        type: boolean
    type: object
info:
  contact:
    name: Soporte El Centinela
  description: |-
    API REST para el sistema de monitoreo de instancias Proxmox El Centinela.
    **Flujo de autenticación**: Login → `/auth/login` → obtener `jwtTemporal` → `/auth/2fa/verify` → obtener `accessToken` → usar en el botón **Authorize** de esta UI.
  title: El Centinela API
  version: "1.0"
paths:
  /account/password:
    put:
      consumes:
      - application/json
      description: Valida la contraseña actual y aplica la nueva. Si la contraseña
        era temporal (`cambioContrasenaRequerido=true`), este cambio limpia ese flag
        y el usuario puede operar con normalidad.
      parameters:
      - description: Contraseña actual y nueva
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.CambiarContrasenaInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Contraseña actual incorrecta o nueva igual a la actual
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cambiar mi contraseña
      tags:
      - Mi cuenta
  /account/profile:
    get:
      description: Devuelve el perfil completo del usuario autenticado, incluyendo
        sus instancias Proxmox permitidas.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioDetalleDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener mi perfil
      tags:
      - Mi cuenta
    put:
      consumes:
      - application/json
      description: Permite al usuario modificar su propio `nombreCompleto` y/o `emailUsuario`.
        No permite cambiar rol ni organización.
      parameters:
      - description: Datos a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.ActualizarPerfilInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioResumenDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email ya en uso
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar mi perfil
      tags:
      - Mi cuenta
  /admin/audit:
    get:
      description: Devuelve el log de auditoría de la organización con soporte de
        filtros, paginación y ordenamiento. Solo accesible por ADMIN.
      parameters:
      - description: Filtrar por UUID de usuario
        in: query
        name: usuarioId
        type: string
      - description: 'Filtrar por tipo de acción (ej: LOGIN, CREAR_USUARIO)'
        in: query
        name: accion
        type: string
      - description: Filtrar por ID de instancia Proxmox
        in: query
        name: instanciaId
        type: string
      - description: 'Filtrar por resultado: EXITO o FALLA'
        in: query
        name: resultado
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      - description: Número de página (default 1)
        in: query
        name: pagina
        type: integer
      - description: Registros por página (default 50, máx 200)
        in: query
        name: tamano
        type: integer
      - description: 'Campo de ordenamiento: fechaHora (default), accion, resultado'
        in: query
        name: ordenarPor
        type: string
      - description: 'Dirección: desc (default) o asc'
        in: query
        name: direccion
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.PaginaAuditoria'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar log de auditoría
      tags:
      - Auditoría (Admin)
  /admin/audit/export:
    get:
      description: Exporta el log de auditoría de la organización. Aplica los mismos
        filtros que el listado. Retorna el archivo como adjunto descargable. Solo
        accesible por ADMIN.
      parameters:
      - description: Filtrar por UUID de usuario
        in: query
        name: usuarioId
        type: string
      - description: Filtrar por tipo de acción
        in: query
        name: accion
        type: string
      - description: Filtrar por ID de instancia
        in: query
        name: instanciaId
        type: string
      - description: EXITO o FALLA
        in: query
        name: resultado
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      - description: 'Formato de exportación: csv (default) o json'
        in: query
        name: formato
        type: string
      produces:
      - text/csv
      - application/json
      responses:
        "200":
          description: Archivo CSV o JSON descargable
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Exportar log de auditoría
      tags:
      - Auditoría (Admin)
  /admin/users:
    get:
      description: 'Devuelve todos los usuarios de la organización del admin autenticado,
        con un resumen (`summary`) de totales por rol. Soporta filtros opcionales:
        `?rol=ADMIN|OPERATOR`, `?activo=true|false`, `?buscar=texto` (nombre o email).'
      parameters:
      - description: 'Filtrar por rol: ADMIN o OPERATOR'
        in: query
        name: rol
        type: string
      - description: 'Filtrar por estado: true o false'
        in: query
        name: activo
        type: boolean
      - description: Buscar por nombre o email (case-insensitive)
        in: query
        name: buscar
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.ListaUsuariosResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar usuarios de la organización
      tags:
      - Usuarios (Admin)
    post:
      consumes:
      - application/json
      description: Crea un nuevo usuario con contraseña temporal generada automáticamente.
        La respuesta incluye `contrasenaTemp` (solo en este momento, nunca más). El
        usuario deberá cambiarla en su primer login. No se envian emails (Plan A).
      parameters:
      - description: Datos del nuevo usuario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.CrearUsuarioInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ports.CrearUsuarioResult'
        "400":
          description: Datos inválidos
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email o username ya registrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}:
    delete:
      description: Marca al usuario como inactivo (`activo=false`) sin borrarlo físicamente,
        e invalida todas sus sesiones activas. Un admin no puede eliminarse a sí mismo.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "400":
          description: No puede eliminarse a sí mismo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar usuario (soft-delete)
      tags:
      - Usuarios (Admin)
    get:
      description: Devuelve el perfil detallado del usuario incluyendo sus instancias
        Proxmox permitidas (`instanciasPermitidas`). Solo devuelve usuarios de la
        misma organización del admin.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioDetalleDTO'
        "400":
          description: UUID inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener usuario por ID
      tags:
      - Usuarios (Admin)
    put:
      consumes:
      - application/json
      description: 'Actualiza parcialmente los datos de un usuario. Solo se modifican
        los campos presentes en el body (semántica PATCH). Campos posibles: `nombreCompleto`,
        `emailUsuario`, `rol`, `activo`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      - description: Campos a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ports.ActualizarUsuarioInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.UsuarioResumenDTO'
        "400":
          description: Datos inválidos
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email ya registrado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/2fa/reset:
    post:
      description: Invalida el secreto TOTP del usuario. En su próximo login deberá
        escanear un nuevo QR para vincular 2FA. También invalida todas sus sesiones
        activas.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resetear 2FA del usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/activity:
    get:
      description: 'Devuelve hasta 100 registros de auditoría del usuario, ordenados
        del más reciente al más antiguo. Soporta filtros: `?accion=START|STOP|...`,
        `?desde=2026-01-01`, `?hasta=2026-12-31`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        type: string
      - description: Filtrar por tipo de acción
        in: query
        name: accion
        type: string
      - description: Fecha desde (YYYY-MM-DD)
        in: query
        name: desde
        type: string
      - description: Fecha hasta (YYYY-MM-DD)
        in: query
        name: hasta
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ports.ActividadDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actividad auditada del usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/instances:
    put:
      consumes:
      - application/json
      description: 'Reemplaza atómicamente todos los permisos de instancia del usuario.
        Envía un array de VMIDs: `{"vmids": [100, 102]}`. Para quitar todos los permisos,
        enviar un array vacío: `{"vmids": []}`.'
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      - description: Lista de VMIDs a asignar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.asignarPermisosRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Asignar instancias Proxmox al usuario
      tags:
      - Usuarios (Admin)
  /admin/users/{id}/password/reset:
    post:
      description: Genera una nueva contraseña temporal segura y la aplica. Devuelve
        `contrasenaTemp` (solo en esta respuesta). El usuario deberá cambiarla en
        su próximo acceso. Invalida todas sus sesiones.
      parameters:
      - description: UUID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resetear contraseña del usuario
      tags:
      - Usuarios (Admin)
  /auth/2fa/qr:
    get:
      description: Genera el secreto TOTP, lo cifra y devuelve el QR en Base64 más
        el secreto manual. Solo disponible con JWT temporal (pre-auth). Llamar únicamente
        si `totpVinculado` es false. Si el usuario ya tiene 2FA activo, se rechaza
        con 409.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.QRResult'
        "400":
          description: Error interno al generar el QR
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Token pre-auth inválido o expirado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: El 2FA ya está activo, requiere reset administrativo
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerPreAuth: []
      summary: Obtener QR de vinculación 2FA
      tags:
      - Autenticación 2FA
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: Recibe el código de 6 dígitos del autenticador. Si es correcto
        emite el `accessToken` (8h) y el `refreshToken` (30 días) con 2FA completado.
        Funciona tanto para la primera vinculación como para logins posteriores.
      parameters:
      - description: Código TOTP de 6 dígitos
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.verificarTotpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.TokenResult'
        "400":
          description: Código inválido (no tiene 6 dígitos)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Código TOTP incorrecto o ya utilizado (anti-replay)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerPreAuth: []
      summary: Verificar código TOTP → obtener tokens definitivos
      tags:
      - Autenticación 2FA
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida email y contraseña. Si son correctas emite un JWT temporal
        (5 min) para continuar el flujo 2FA. El campo `totpVinculado` indica si el
        usuario debe escanear el QR (false) o ingresar el código TOTP (true). El campo
        `cambioContrasenaRequerido` indica si la contraseña es temporal y debe cambiarse.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.LoginResult'
        "400":
          description: Formato de petición inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Credenciales incorrectas
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Login de usuario
      tags:
      - Autenticación
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalida la sesión asociada al refresh token recibido. El frontend
        debe descartar los tokens locales. Responde 204 sin body.
      parameters:
      - description: Token de refresco de la sesión a cerrar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Formato de petición inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Refresh token inválido o sesión ya cerrada
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Cerrar sesión (logout)
      tags:
      - Autenticación
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Recibe un refresh token válido y emite un nuevo access token (8h).
        El refresh token no cambia.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ports.TokenResult'
        "400":
          description: Body inválido
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Refresh token inválido o expirado
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Renovar access token
      tags:
      - Autenticación
  /roles:
    get:
      description: Devuelve los roles definidos en el sistema (ADMIN y OPERATOR).
        Útil para poblar selectores en el frontend al crear o editar usuarios.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ports.RolDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar roles disponibles
      tags:
      - Usuarios (Admin)
securityDefinitions:
  BearerAuth:
    description: 'Token de acceso definitivo. Formato: **Bearer &lt;accessToken&gt;**.
      Obtené el token completando el flujo: `POST /auth/login` → `POST /auth/2fa/verify`.'
    in: header
    name: Authorization
    type: apiKey
  BearerPreAuth:
    description: 'JWT temporal pre-2FA. Formato: **Bearer &lt;jwtTemporal&gt;**. Obtené
      el token de `POST /auth/login`.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
