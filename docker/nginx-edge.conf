# ==============================================================================
# El Centinela — Nginx Edge Reverse Proxy (CT 100)
# Archivo de referencia: docker/nginx-edge.conf
#
# Despliegue en producción / servidor:
#   Copiar a /etc/nginx/sites-available/ en CT 100 y ejecutar:
#   nginx -t && systemctl reload nginx
# ==============================================================================

# Mapeo de cabecera Connection para soporte de WebSockets según RFC 6455.
# Si el cliente envía Upgrade, se setea Connection "upgrade"; de lo contrario se cierra.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream hacia la API Go de El Centinela (CT 102 en pruebas / CT 104 en estable)
upstream backend_upstream {
    server 10.10.10.30:8080;
    keepalive 32;
}

# (Opcional) Upstream para el Frontend SPA si se sirve en contenedor separado
# upstream frontend_upstream {
#     server 10.10.20.101:80;
# }

server {
    listen 80;
    listen [::]:80;
    server_name centinela.local; # Reemplazar con el dominio / Tailscale FQDN

    # Seguridad y límites generales
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. WebSockets & Telemetría Interactiva (Etapa 2)
    # Rutas: /api/ws/* y /ws/*
    # --------------------------------------------------------------------------
    location ~ ^/(api/ws|ws)/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Handshake WebSocket (HTTP 101 Switching Protocols)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Encabezados de cliente y proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffers y extender timeouts de sesión (evita cortes a los 60s)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 2. Server-Sent Events (SSE) en tiempo real
    # Ruta: /api/events (Etapa 1 - Notificaciones y UPID)
    # --------------------------------------------------------------------------
    location = /api/events {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming sin buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. API REST Tradicional
    # Ruta: /api/*
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. Frontend SPA (Archivos estáticos o proxy)
    # --------------------------------------------------------------------------
    location / {
        # Si se sirve localmente dentro del CT 103:
        # root /var/www/centinela-front/dist;
        # try_files $uri $uri/ /index.html;

        # O si se proxea a un upstream:
        # proxy_pass http://frontend_upstream;
        proxy_pass http://backend_upstream; # Fallback por defecto si la API sirve estáticos
    }
}
