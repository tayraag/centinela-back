version: '0.0'

services:
  db:
    image: postgres:16-alpine
    container_name: centinela-postgres
    restart: always
    environment:
      POSTGRES_USER: centinela_admin
      POSTGRES_PASSWORD: centinela_password
      POSTGRES_DB: centinela_db
    ports:
      # tengo colision con 5432 asique le pongo 5433. Chequear en el futuro
      - "5433:5432"
    volumes:
      # linea magica que hace que la bd persista en el disco aunque apagues todo
      - postgres_data:/var/lib/postgresql/data
      # Inyectamos el script inicial para los UUIDv7
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: